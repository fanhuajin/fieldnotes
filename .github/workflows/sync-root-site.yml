name: Sync root website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-root-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build root website
        run: node scripts/build-root-site.mjs
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: fanhuajin/fanhuajin.Github.io
          ref: master
          path: root-deploy
          ssh-key: ${{ secrets.ROOT_SITE_DEPLOY_KEY }}
      - name: Sync website files
        run: |
          set -euo pipefail
          for directory in assets vendor lib home tags lists list; do
            mkdir -p "root-deploy/$directory"
            rsync -a --delete ".packaging/root-site/$directory/" "root-deploy/$directory/"
          done
          cp .packaging/root-site/{index.html,404.html,app.js,style.css,LICENSE,.nojekyll} root-deploy/
          cd root-deploy
          git add -- assets vendor lib home tags lists list index.html 404.html app.js style.css LICENSE .nojekyll
          if git diff --cached --quiet; then
            echo "Website is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: sync fieldnotes ${GITHUB_SHA:0:12}"
          git push origin HEAD:master
